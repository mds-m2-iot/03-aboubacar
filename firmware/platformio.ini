; Firmware de reference · Ma plante connectee
; Module M2 Applications mobiles et connectees (IoT) · Sergent.dev
;
; Compilation :   pio run
; Televersement : pio run -t upload
; Console serie : pio device monitor -e <environnement>
;
; Le -e n'est pas facultatif. Le moniteur charge le filtre
; esp32_exception_decoder, qui a besoin du fichier .elf de l'environnement
; compile. Sans -e il cherche celui de esp32dev et annonce
; « firmware ... does not exist, rebuild the project? », ce qui envoie sur
; une fausse piste : le projet est tres bien compile, simplement ailleurs.
;
; Le binaire pour l'outil de flash web est produit dans
; .pio/build/esp32dev/firmware.bin

; --------------------------------------------------------------------
; Reglages communs aux trois modes. Les environnements ble / demo qui
; suivent servent au formateur pour verifier que les trois compilent :
; les etudiants, eux, changent MODE_FIRMWARE dans src/config.h.
; --------------------------------------------------------------------
[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Traduit les traces de plantage en fichier et numero de ligne. Sans ce
; filtre, un crash n'affiche qu'une liste d'adresses memoire.
monitor_filters = esp32_exception_decoder

; La table par defaut ne laisse que 1,31 Mo par emplacement applicatif,
; et le firmware complet (Bluetooth + WiFi + TLS + ecran) en occupe 94 %.
; min_spiffs porte chaque emplacement a 1,9 Mo : sans cela, la premiere
; mise a jour a distance un peu plus grosse ne rentrerait plus.
board_build.partitions = min_spiffs.csv

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DVERSION_FIRMWARE=\"1.0.0\"

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    bblanchon/ArduinoJson@^7.2.0

; --------------------------------------------------------------------
; Environnements de verification du formateur
; --------------------------------------------------------------------
[env:esp32dev]
; mode par defaut, celui de src/config.h

[env:ble]
; seance 2 · capteurs + ecran + annonce Bluetooth, aucun reseau
build_flags = ${env.build_flags} -DMODE_FIRMWARE=0

[env:dual]
; seances 3 a 6 · en plus du reste, WiFi, MQTT et mise a jour a distance
; Demande le reseau de la salle : hors de la salle, la carte cherche un
; WiFi absent pendant quinze secondes avant de continuer sans lui.
build_flags = ${env.build_flags} -DMODE_FIRMWARE=1

[env:demo]
; seance 7 et portes ouvertes · mesures rejouees, aucun reseau
build_flags = ${env.build_flags} -DMODE_FIRMWARE=2

[env:simu]
; Le binaire destine au simulateur Wokwi : le mode capteurs, prive de sa
; radio.
;
; Deux raisons a ce choix, et elles se cumulent.
;
; La radio d'abord : Wokwi ne simule pas le Bluetooth, et les trois
; modes livres l'allument tous, y compris le mode demo dont le contrat
; prevoit expressement le BLE pour le telephone des portes ouvertes. La
; pile cherche alors un controleur absent, la tache btController ne rend
; jamais la main, et le chien de garde abat le systeme en une dizaine de
; secondes. Voir l'explication en tete de src/main.cpp.
;
; Le mode ensuite : on part de MODE_BLE et non de MODE_DEMO parce que
; l'atelier de la seance 1 demande aux etudiants de faire varier les
; mesures. Le mode demo rejoue une journee enregistree, sans lire les
; capteurs : tourner le potentiometre n'y changerait rien. Le mode
; capteurs, lui, reste interactif.
;
; Cet environnement ne part jamais sur du vrai materiel.
build_flags = ${env.build_flags} -DMODE_FIRMWARE=0 -DSANS_RADIO=1

[env:simu-reseau]
; Le second binaire du simulateur : le mode reseau, prive de radio
; Bluetooth. Wokwi simule le WiFi et laisse sortir le trafic MQTT, ce
; qui rend testables sans carte les trous des seances 3 et 6.
;
; Le WiFi du simulateur s'appelle « Wokwi-GUEST », sans mot de passe :
; c'est la valeur a mettre dans config.h avant de compiler cet
; environnement, sinon la carte cherche indefiniment un reseau qui
; n'existe que dans la salle.
;
; Comme l'environnement simu, il ne part jamais sur du vrai materiel.
build_flags = ${env.build_flags} -DMODE_FIRMWARE=1 -DSANS_RADIO=1
